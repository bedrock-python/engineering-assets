# Which repositories this hub delivers to, and which packs each one gets
# (touchmark, format v1). The JSON Schema for editors: `touchmark schema targets`.
#
# A repository selected here receives nothing until it opts in with an
# .engineering-assets.yml file at its root; an empty file is enough. The opt-in
# file can add packs and ignore paths, but cannot remove a pack assigned here.
# An entry with opt_in: assumed subscribes the repositories it selects instead:
# they get their packs without the file, and opt out with a file that says
# enabled: false.
#
# A target's packs, in order: defaults.packs, then the packs of every entry
# that matches it (in file order), then the packs of its opt-in file. Each
# pack's requires from hub.yml comes before it; when two packs ship the same
# path, the later one wins.
version: 1

defaults:
  # zensical-docs and bedrock-community ship what the libraries already have,
  # so they connect with an empty diff (expected.md); the starter packs are
  # new everywhere, and they are what the first sync pull requests carry.
  packs: [zensical-docs, bedrock-community, agents, claude, python-library]
  # The hub subscribes the libraries itself: they share one owner with it.
  # Step 2 of the rollout (README): once deadline-budget's first sync pull
  # request is merged, uncomment this and drop the deadline-budget entry.
  # opt_in: assumed

targets:
  # The libraries created from bedrock-python/python-library-template: the
  # organisation's repositories with the topic python, which on 2026-10-07
  # were exactly the 13 that expected.md lists. A new library is picked up
  # once both of the hub's GitHub Apps are installed on it.
  - org: bedrock-python
    topics: [python]
  # Step 1 of the rollout: one library without files of its own.
  - repo: bedrock-python/deadline-budget
    opt_in: assumed

# Python repositories that are not libraries: mr-review (an application with
# its own agent setup), the blog, and python-library-template itself, whose
# files live under template/.
exclude:
  - bedrock-python/mr-review
  - bedrock-python/bedrock-python.github.io
  - bedrock-python/python-library-template
